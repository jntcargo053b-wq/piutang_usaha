name: piutang_usaha
description: Aplikasi manajemen piutang usaha dengan SQLite, laporan, export, backup/restore, dan scan barcode.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  share_plus: ^12.0.2
  pdf: ^3.11.0
  excel: ^4.0.3
  file_picker: ^10.3.3
  path_provider: ^2.1.3
  mobile_scanner: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
