name: Build Piutang Usaha APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.piutangusaha .

      - name: Set Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          text = text.replace('compileSdk flutter.compileSdkVersion', 'compileSdk 36')
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          p.write_text(text)
          PY
          grep -n "compileSdk" android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piutang-usaha-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
