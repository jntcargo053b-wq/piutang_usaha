name: Build Piutang Usaha APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.piutangusaha .

      - name: Set Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path('android/app/build.gradle'),
              Path('android/app/build.gradle.kts'),
          ]
          path = next((p for p in candidates if p.is_file()), None)
          if path is None:
              raise SystemExit('Android app Gradle file was not generated')

          text = path.read_text()
          original = text

          replacements = [
              ('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36'),
              ('compileSdk flutter.compileSdkVersion', 'compileSdk 36'),
              ('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)

          if text == original or 'compileSdk = 36' not in text and 'compileSdk 36' not in text:
              raise SystemExit(f'Could not set compileSdk 36 in {path}')

          path.write_text(text)
          print(f'Using {path}')
          for line in text.splitlines():
              if 'compileSdk' in line:
                  print(line)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piutang-usaha-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
